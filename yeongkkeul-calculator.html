<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영끌계산기 — 내 현금으로 넘볼 수 있는 집</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- BUILD v23.22 · 정책 2026.08.05 -->
<style>
/* ===================================================================
   v23.20 — 네오 브루탈리즘 폐기. 쿨 그레이 + 핀테크 그린 + 앰비언트 섀도우.
   ⚠ 카드가 배경에서 분리되는 근거는 「배경색 차이 + 은은한 그림자」 둘입니다.
     v23.19는 「검은 테두리」 하나뿐이라 지우면 카드가 사라졌습니다(원칙 101).
     지금은 근거가 둘이므로 하나를 잃어도 버팁니다.
   =================================================================== */
:root{
  color-scheme:light;                      /* 시스템 다크모드로 폼 컴포넌트가 반전되는 것을 막습니다 */
  /* 🔴 v23.22 — 브랜드 그린은 **단 하나**입니다. --green-ink(짙은 녹색)를 정의부터 지웠습니다.
     원칙 102(면용/글자용 두 값)는 「그린을 글자로도 쓰려면」의 답이었습니다.
     v23.22의 답은 더 강합니다 — **그린을 글자로 아예 쓰지 않습니다.**
     글자는 잉크 4단(--ink ~ --ink-4), 그린은 「지금 이것이 선택·활성」이라는 면·선에만 씁니다.
     ⚠ 되살리지 마세요. 값이 둘이 되는 순간 화면마다 다른 초록이 섞입니다.
     채널 B 판정 = --ok(무채색) → --warn(오렌지) → --bad(딥 레드)
     채널 C 제휴 = 색을 쓰지 않습니다. 흰 면 + 얇은 윤곽 + ↗ 로만 가릅니다 */
  --bg:#F2F4F6; --card:#FFFFFF;              /* 쿨 그레이 바탕 · 퓨어 화이트 카드 */
  --fill:#EEF0F3;                            /* 입력칸 면 — ⚠ --bg와 같은 값이면 카드 밖에서 사라집니다(원칙 97) */
  --line:#E5E8EB;                            /* 헤어라인 · 트랙 · 비활성 면 */
  --grad-1:#000000; --grad-2:#191F28;        /* 공유 리포트 전용 */
  --espresso:#191F28; --espresso-2:#000000;  /* 솔리드 다크 면 */
  --green:#00CA71;      /* 채널 A — 면·선 전용. 흰 바탕 위 글자로는 1.97:1이라 글자로 못 씁니다 */
  --bronze-hi:#8B95A1;  /* 다크 면 위 전용 — 밝은 면에는 쓰지 않습니다 */  /* 공유 리포트 보조 글자 */
  --ink:#191F28; --ink-2:#333D4B; --ink-3:#4E5968;
  /* ⚠ --ink-4는 v23.19까지 #8B95A1(흰 면 위 3.04:1)이었습니다. 마이크로 라벨에는 통했지만
     v23.20에서 넛지 문장(13px 본문)이 이 색을 쓰게 되어 AA를 못 넘겼습니다. 한 단 내립니다. */
  --ink-4:#6B7684;
  /* 🔴 v23.20 — 「부담」에 초록을 쓰지 않습니다. 낮음은 색이 아니라 「조용함」으로 말합니다.
     무채색 → 오렌지 → 딥 레드. 명도 사다리가 아니라 채도 사다리입니다.
     🔴 v23.21 — 같은 사다리를 유지하되 **탁한 흙색을 순색으로 바꿨습니다.**
     이전 두 값은 채도가 낮아(R-max(G,B) = 83 · 91) 밤색으로 읽혔습니다.
     지금은 115 · 177로, 4.5:1을 지키면서 낼 수 있는 가장 맑은 오렌지·레드입니다.
     ⚠ 이전 hex를 주석에 적지 않습니다 — 「탁한 밤색 잔재 없음」 검사가 파일 전체를 봅니다.
     기준: 흰 면 위 ≥4.5:1 · R>G>B · 주의가 위험보다 옅을 것. 확인일 2026.08.10 */
  --ok:#333D4B;        /* 부담 낮음 — 무채색. 정상은 신호를 보내지 않습니다 (11.00:1) */
  --warn:#BE4B00;      /* 부담 중간 — 순색 오렌지 (흰 면 위 5.00:1 · 색상각 24°) */
  --bad:#C00F0C;       /* 부담 높음 — 순색 레드 (흰 면 위 6.33:1 · 색상각 1°) */
  /* 🔴 v23.21 — 세로선을 지운 자리를 「면」이 대신합니다. 6% 틴트 하나로 위계를 만듭니다. */
  --warn-tint:rgba(190,75,0,.06);            /* 규제지역 · 초과 안내 면 */
  --ink-tint:rgba(25,31,40,.04);             /* 중립 안내 면 (결과 헤더의 한 줄 이유) */
  /* ⏹ --glass / --glass-line / --glass-2 는 v23.21에서 삭제했습니다.
     어떤 규칙도 var()로 부르지 않는 죽은 토큰 3개였고, G-6(색 ≤26)의 정원만 먹고 있었습니다.
     죽은 CSS는 죽은 값이 아니라 「살아 있는 두 번째 정의」입니다(원칙 84 · 지침 6-6).
     ⚠ 부활시키려면 쓰는 규칙과 함께 되살립니다. */
  /* 🔴 입체감은 앰비언트 섀도우로만 냅니다. 오프셋 하드 섀도우는 v23.20에서 폐기했습니다. */
  --hair:1px solid #E5E8EB;
  --sh:0 4px 20px rgba(0,0,0,.03);
  --sh-lift:0 10px 30px rgba(0,0,0,.08);

  --d1:50px; --t1:28px; --t2:25px; --t3:20px; --t4:17px; --t5:16px; --t6:14px; --t7:12.5px;
  --r-m:14px; --r-l:20px; --r-xl:26px; --r-pill:999px;
  /* 🔴 v23.21 — 카드 안쪽 여백을 24 → 20px으로 줄였습니다.
     바깥 여백(16px)은 이미 목표치였고, 폭을 실제로 먹고 있던 것은 **카드 자신의 패딩**입니다.
     360px 화면에서 내용 폭 280 → 296px. 「10억」·「0만」 입력칸이 그만큼 숨을 쉽니다. */
  --gap:16px; --pad:20px; --dock:112px;
}
@media (max-width:400px){ :root{ --d1:40px; --t1:25px; --t2:22px; }
  .funnel{padding:22px 12px 32px} .result{padding:0 12px 40px}
  .brand{padding:26px 14px 4px} }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;padding:0;overflow-x:hidden;color-scheme:light}
/* 시스템이 다크모드여도 우리 톤을 그대로 쓴다 */
@media (prefers-color-scheme:dark){
  html,body{background:var(--bg);color:var(--ink)}
  input,select,button,textarea{color-scheme:light}
}
img,svg{forced-color-adjust:none}
/* clip은 스크롤 컨테이너를 만들지 않아 position:sticky를 깨지 않습니다 */
.app{overflow-x:clip}
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:var(--t5);line-height:1.5;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,p,.q-title,.headline,.card-title,.hero-label{text-wrap:balance}
/* 🔴 button·input은 font-family만 상속받고 letter-spacing은 상속하지 않습니다.
   전역 -.02em을 선언해도 칩·세그먼트·CTA는 브라우저 기본값(normal=0)으로 렌더되어
   본문보다 미세하게 퍼져 보였습니다. 여기서 명시적으로 이어 붙입니다. */
button{font-family:inherit;font-variant-numeric:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;
  color:inherit;word-break:keep-all}
input{font-family:inherit;font-variant-numeric:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--espresso);outline-offset:3px;border-radius:8px}

.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:var(--dock)}
.app.no-dock{padding-bottom:0}
.appbar{position:sticky;top:0;z-index:20;background:var(--bg);height:56px;display:flex;
  align-items:center;padding:0 10px;transition:background .2s}
.app.hero-on .appbar{background:var(--bg)}
.app.hero-on .appbar .barlabel{color:var(--ink-3)}
.app.hero-on .progress{background:var(--line)}
.app.hero-on .progress i{background:var(--green)}
.iconbtn{width:40px;height:40px;border-radius:var(--r-m);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--fill)}
.barlabel{font-size:var(--t6);font-weight:700;color:var(--ink-3);margin-left:4px}
.progress{position:sticky;top:56px;z-index:20;height:2px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .34s cubic-bezier(.22,1,.36,1)}

/* ── 브랜드 ─────────────────────────────────── */
/* 입력 01 상단 밴드 — 좌우 끝까지 차는 딥 네이비.
   ⚠ 지침 6-4「다크 면은 화면에 두지 않는다」는 **결과 화면** 규칙입니다.
     여기는 입력 첫 화면의 헤더 밴드라 적용 대상이 아닙니다. */
/* 🔴 v23.14 — 넓은 어두운 면을 걷어냈습니다.
   지적은 「네이비 색」이 아니라 「넓은 면적」이었는데,
   v23.13에서 색만 블랙으로 바꾸고 면적을 그대로 둔 것이 오류였습니다.
   레퍼런스처럼 바탕은 밝게, 라임을 액센트 면으로 씁니다. */
/* 🔴 v23.21 — 좌우 24 → 18px. 타이틀은 세로선 때문에 안쪽으로 18px 더 들어가므로
   18+18 = 36px가 되어, 아래 히어로 카드의 글자 시작점(16+20 = 36px)과 **정확히 맞습니다.**
   이전에는 42 vs 40으로 2px 어긋나 있었습니다. */
.brand{background:var(--bg);padding:30px 18px 4px;margin:0}
.brand .headline{color:var(--ink)}
.brand .headline::before{background:var(--green)}
.brand .subline{color:var(--ink-3)}
/* 🔴 밴드가 화면 위쪽을 이미 먹었으므로 퍼널은 min-height를 푸니다.
   안 풀면 페이지가 1.5배로 늘어나 하단이 통째로 비어 보입니다. */
.app.hero-on .funnel{padding-top:0;min-height:0;padding-bottom:24px}
/* ⏹ v23.22 — 히어로 전용이던 흰 카드 규칙을 01·02·03 전부로 올렸습니다(아래 .funnel > .q).
   02·03에서만 질문이 회색 바닥에 맨몸으로 놓이고 그 안에 다시 흰 .moneycard가 들어가
   「회색 → 흰 카드 → 회색 필드」 3중첩이 됐습니다. 지금은 「흰 카드 → 회색 필드」 둘입니다. */
/* 세로선 — 에디토리얼 리포트의 구조적 킥. 장식 문구 없이 모양으로만 임팩트를 냅니다. */
.headline{position:relative;font-size:var(--t2);line-height:1.15;font-weight:900;
  letter-spacing:-.05em;margin:0;padding-left:18px}
.headline::before{content:'';position:absolute;left:0;top:.18em;bottom:.18em;
  width:4px;border-radius:2px;background:var(--espresso)}
.headline b{color:inherit;font-weight:900;letter-spacing:-.05em}
.subline{font-size:var(--t6);line-height:1.8;font-weight:300;color:var(--ink-3);margin:18px 0 0;padding-left:18px}

/* ── 퍼널 ───────────────────────────────────── */
.funnel{padding:24px 16px 36px;display:flex;flex-direction:column;
  min-height:calc(100dvh - 58px - var(--dock))}
/* 🔴 v23.22 — 질문 블록은 01·02·03 모두 같은 흰 카드입니다.
   ⚠ 카드에 테두리를 두르지 않습니다. .card·.tile과 같은 「그림자 하나」 문법으로 통일합니다. */
.funnel > .q{flex:none;background:var(--card);border:0;border-radius:var(--r-xl);
  padding:var(--pad);margin-top:20px;box-shadow:var(--sh)}
.q{animation:rise .32s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:var(--t7);font-weight:800;color:var(--espresso);letter-spacing:.1em;margin:0 0 12px}
.q-title{font-size:var(--t2);line-height:1.15;font-weight:900;letter-spacing:-.05em;margin:0}
.q-sub{font-size:var(--t6);color:var(--ink-3);margin:14px 0 0}
.q-sub.oneline{white-space:nowrap;font-size:clamp(11px,3.5vw,var(--t6));letter-spacing:-.03em}

/* 질문 → 입력 카드 간격은 01·02·03이 같아야 합니다(24px).
   01은 히어로 카드 안이라 20px, 02·03은 28px이어서 스크롤할 때 리듬이 어긋났습니다. */
/* 🔴 v23.22 — 입력칸을 감싸던 흰 라운드 박스(베젤)를 통째로 지웠습니다.
   흰 질문 카드 위에 회색 필드가 바로 놓입니다. 이제 .moneycard는 「간격」만 담당합니다.
   ⚠ 여기에 background·padding·box-shadow를 다시 넣으면 3중첩이 그대로 부활합니다. */
.moneycard{margin-top:24px;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
/* 두 칸 입력 — 320px 화면에서도 넘치지 않게 폭을 계산해 잡았습니다.
   이전 값(패딩 16·글자 28px 고정)은 360px에서 14px 넘쳤습니다. */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
/* 🔴 v23.22 전역 규칙 — 입력 필드는 **테두리 0 · 옅은 회색 면**입니다.
   ⚠ 포커스 표시는 outline으로 냅니다. border를 키우면 상자가 커져 줄이 흔들립니다(원칙 34).
     outline은 레이아웃을 전혀 건드리지 않습니다. */
.mfield{display:flex;align-items:baseline;gap:0;background:var(--fill);border-radius:var(--r-m);
  border:0;padding:16px 14px;overflow:hidden;transition:background-color .2s ease}
.mfield:focus-within{outline:2px solid var(--green);outline-offset:-2px}
.mfield input{flex:1;width:100%;min-width:0;max-width:100%;border:0;padding:0;background:none;
  text-align:right;color:var(--ink);font-size:clamp(19px,6vw,var(--t1));line-height:1.15;
  font-weight:900;letter-spacing:-.04em}
.mfield input::placeholder{color:var(--ink-4)}
.mfield input:focus{outline:none}
/* 🔴 v23.20에서 뒤집었습니다. v23.18의 -1px은 트래킹 잔여 폭을 상쇄해 「10억」을 한 덩어리로
   붙였지만, 큰 숫자에서는 단위가 숫자에 짓눌려 떡져 보였습니다.
   자간을 -.04em으로 한 단 풀고 단위에 4px 숨통을 줍니다. 「붙이기」에서 「숨쉬기」로 바뀐 자리입니다. */
.mfield span{font-size:var(--t6);font-weight:700;color:var(--ink-3);flex:none;white-space:nowrap;
  letter-spacing:-.02em;margin-left:4px}
/* ⏹ .mrow / .grown 은 v23.18에서 삭제했습니다 — 두 칸 입력(.mgrid)으로 바뀐 뒤
   어떤 마크업도 쓰지 않는 죽은 규칙이었고, 금액 자간을 -.04em으로 되돌리는
   두 번째 정의가 여기 남아 있었습니다(원칙 84 — 값은 한 곳에서만 정한다). */
/* 값이 들어오면 사라집니다. 두 칸이 이미 「10억 0만」을 보여주는데
   아래에서 「10억원」을 한 번 더 말하면 같은 말을 두 번 하는 것입니다(원칙 43). */
/* 🔴 v23.22 — 헬퍼 텍스트 컴포넌트. 필드에 **종속**시킵니다(마진 6px · 12.5px · 쿨 그레이).
   ⚠ 색은 --ink-4(#6B7684 · 흰 면 위 4.62:1)입니다. 한 단 밝은 #8B95A1은 3.04:1로
     본문 기준(4.5:1)을 못 넘깁니다. v23.20에서 같은 이유로 한 번 내린 값입니다. */
.helper{margin:6px 0 0;font-size:var(--t7);font-weight:400;color:var(--ink-4);line-height:1.6}
.helper b{color:var(--ink-3);font-weight:700}
.helper + .helper{margin-top:4px}
.readout{margin:6px 0 0;font-size:var(--t7);font-weight:400;color:var(--ink-4);line-height:1.6}
.readout:empty{display:none}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
/* 🔴 v23.22 전역 규칙 — 선택 칩·버튼의 테두리.
   기본 var(--line) / 활성 var(--green). **폭은 두 상태가 같습니다(1.5px).**
   ⚠ 지시는 「기본 1px → 활성 1.5px」였지만, 폭이 변하면 상자가 0.5px 커져 칩 줄이 흔들립니다
     (원칙 34 · G-14). 활성 사양(1.5px 그린)을 그대로 지키고 기본을 1.5px로 맞췄습니다.
     #E5E8EB는 1.5px에서도 헤어라인으로 읽힙니다. */
.chip{padding:11px 16px;border:1.5px solid var(--line);border-radius:var(--r-pill);background:var(--card);
  font-size:var(--t6);font-weight:700;color:var(--ink-2);box-shadow:var(--sh);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .14s,color .14s,border-color .14s}
.chip:hover{color:var(--espresso)}
.chip:active{transform:scale(.94)}
.chip.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 선택 = 흰 면 + 그린 글자 + 떠 있는 그림자. 테두리는 쓰지 않습니다.
   ⚠ border를 0으로 지우면 미선택(1px hair)과 상자 크기가 어긋나 줄이 흔들립니다.
      1px를 투명으로 남겨 치수를 고정합니다. */
/* 🔴 v23.22 — **선택해도 글자 굵기를 바꾸지 않습니다.**
   700 → 800은 글자를 넓혀 칩 상자를 1.02px 키웠고, 칩 줄이 미세하게 다시 흘렀습니다.
   G-14(테두리 폭)는 이걸 못 봤습니다 — G-17(렌더된 상자 폭)이 잡은 자리입니다.
   선택 신호는 이미 셋입니다: 그린 테두리 · 뜨는 그림자 · 잉크로 진해지는 글자. */
.chip.is-on{background:var(--card);color:var(--ink);border-color:var(--green);
  box-shadow:var(--sh-lift)}
.chip.is-clear{color:var(--ink-4);font-weight:600;box-shadow:none;background:none;border-color:transparent}

.zonegrid{margin-top:28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.zonecard{padding:20px 6px;border:1.5px solid var(--line);border-radius:var(--r-l);background:var(--card);
  box-shadow:var(--sh);text-align:center;transition:.14s}
.zonecard.is-on{background:var(--card);border-color:var(--green);box-shadow:var(--sh-lift)}
.zonecard b{display:block;font-size:var(--t6);font-weight:700}
.zonecard.is-on b{color:var(--ink)}
.pane{margin-top:26px}
.pane-title{font-size:var(--t7);font-weight:700;color:var(--ink-4);margin:0 0 12px;letter-spacing:.02em}
.taggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.taggrid .chip{padding:14px 10px;font-size:var(--t7);text-align:center;line-height:1.35;
  letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidoscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.sidoscroll::-webkit-scrollbar{display:none}
.sidoscroll .chip{flex:none;padding:11px 16px;font-size:var(--t7)}

.seg{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--fill);
  padding:5px;border-radius:var(--r-m)}
/* 세그먼트도 칩과 같은 선택 언어입니다 — 폭 고정 1.5px, 색만 바뀝니다. */
.seg button{padding:13px 4px;border:1.5px solid transparent;border-radius:10px;font-size:var(--t7);
  font-weight:700;color:var(--ink-3);transition:.14s}
.seg button.is-on{background:var(--card);border-color:var(--green);color:var(--ink);
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.blockhead{margin:34px 0 0;font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:-.02em}
.debtlink{margin-top:30px;padding:0;font-size:var(--t7);font-weight:600;color:var(--ink-3);
  letter-spacing:-.02em;transition:color .12s}
.debtlink:hover{color:var(--ink)}
.debtbox{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.debtbox.open{display:block}
/* 🔴 연소득 칸과 100% 같은 폼이어야 합니다.
   .mfield의 배경(--fill)은 앱 배경(--bg)과 같은 값이라, 흰 카드 밖에 두면
   회색 박스가 통째로 사라지고 「0만」만 허공에 뜹니다. moneyCard()와 같은 껍데기를 씌웁니다.
   ⚠ v23.22 — 설명은 입력칸 **아래**에 종속시킵니다(.helper). 위에 띄우면 어느 필드의 설명인지 흐려집니다. */
.debtcard{margin-top:0}
/* 넛지 — 「얼마인지 모르겠다」에서 멈추는 사람을 위한 어림값입니다. 헬퍼와 같은 컴포넌트를 씁니다. */
.q-hint{margin:4px 0 0;font-size:var(--t7);line-height:1.6;color:var(--ink-4);font-weight:400}
/* 물어보는 값이 하나뿐이므로 2단 그리드를 벗기고 한 칸이 폭을 다 씁니다. */
.debtcard .mfield{width:100%}
.subtoggle{margin-top:24px;display:flex;align-items:center;gap:11px;font-size:var(--t6);font-weight:600;color:var(--ink-3)}
/* 브라우저 기본 체크박스를 날리고 직접 그립니다.
   accent-color만 주면 OS마다 모양이 달라 통일되지 않습니다. */
.subtoggle input{-webkit-appearance:none;appearance:none;position:relative;flex:none;
  width:22px;height:22px;margin:0;border-radius:7px;background:var(--card);
  box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;
  transition:background .14s, box-shadow .14s}
.subtoggle input::after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;
  border:solid var(--espresso);border-width:0 2.2px 2.2px 0;border-radius:1px;
  transform:rotate(45deg) scale(.6);opacity:0;transition:transform .14s, opacity .14s}
/* 체크 표시는 잉크입니다 — 흰 체크를 --green 위에 얹으면 1.97:1로 안 보입니다. */
.subtoggle input:checked{background:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.subtoggle input:checked::after{transform:rotate(45deg) scale(1);opacity:1}
.subtoggle input:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.answered{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.answered:not(:empty){margin-top:auto}
.q + .answered{margin-top:44px}          /* 내용이 길면 최소 간격은 지킵니다 */
@supports (height:100dvh){ .answered:not(:empty){margin-top:auto} }
.answered:empty{display:none}
.arow{width:100%;display:flex;align-items:center;gap:12px;padding:15px 4px;text-align:left;border-radius:var(--r-m)}
.arow:hover{background:var(--fill)}
.arow .k{font-size:var(--t7);color:var(--ink-4);min-width:66px;flex:none}
.arow .v{font-size:var(--t6);font-weight:700;color:var(--ink-2);flex:1}
.arow .go{font-size:var(--t7);font-weight:800;color:var(--ink-3);flex:none}

.dock{position:fixed;left:0;right:0;z-index:30;max-width:480px;margin:0 auto;
  padding:0 16px;bottom:calc(22px + env(safe-area-inset-bottom))}
/* 🔴 v23.20 — 둥근 캡슐을 벗겼습니다. 알약 안에 알약이 들어 있어 좌우 여백이 두 번 먹혔고,
   엄지가 닿는 폭이 실제보다 좁았습니다. 이제 두 버튼이 폭을 그대로 나눠 씁니다. */
.dockrow{display:flex;gap:8px}
/* ⚠ --fill(#EEF0F3)은 앱 배경 --bg(#F2F4F6)와 1.02:1입니다. 독은 배경 위에 떠 있으므로
   회색 면으로 두면 버튼이 사라집니다(원칙 97). 세컨더리는 흰 면 + 헤어라인으로 통일합니다. */
.cta.back{flex:0 0 90px;width:auto;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.cta.back:hover{color:var(--ink);background:var(--fill);filter:none}
/* CTA — 흰 글자를 고집하면 배경을 #00794A까지 낮춰야 해서 버튼이 탁해집니다(5.48:1).
   글자를 잉크로 뒤집으면 화사한 #00CA71을 그대로 쓰면서 대비가 오히려 올라갑니다.
   #191F28 on #00CA71 = 7.64 : 1. 채도를 죽이는 대신 글자를 바꾼 자리입니다.
   ⚠ 독에서는 flex:1로 남은 폭을 다 씁니다. width:100%는 flex 계산을 방해하지 않습니다. */
.cta{width:100%;height:54px;border-radius:var(--r-m);background:var(--green);color:var(--espresso);
  font-size:var(--t5);font-weight:900;letter-spacing:-.02em;
  transition:background .14s,color .14s,transform .12s}
/* 호버에서 색을 바꾸지 않습니다 — 그린이 하나뿐이라 「더 짙은 그린」이 존재하지 않습니다.
   밝기와 그림자로만 반응합니다. 잉크 글자는 그대로라 대비 7.64:1이 유지됩니다. */
.cta:hover{filter:brightness(.94);box-shadow:var(--sh-lift)}
.cta:active{transform:scale(.985)}
.cta:disabled{background:var(--line);color:var(--ink-4);cursor:default;transform:none}
.dockrow .cta{flex:1;min-width:0;box-shadow:var(--sh-lift)}
.dockrow .cta.back{flex:0 0 90px;box-shadow:var(--sh)}

/* ═══ 결과 ═══════════════════════════════════ */
.result{padding:0 16px 44px}
/* 헤더는 카드가 아닙니다. 배경 위에 얹어 화면 하나를 통째로 먹던 검은 박스를 없앴습니다. */
.rhead{padding:12px 4px 22px}
.rhead-label{font-size:var(--t5);font-weight:300;color:var(--ink-3);margin:0;line-height:1.3}
/* 핵심 수치 밑에 라임 하이라이트 — 숫자가 먼저 읽힐니다 */
/* 🔴 마커는 금액 span에만 걸어야 합니다.
   문단 전체에 걸면 오른쪽 「수준이에요」까지 덮어버립니다(v23.10 수정). */
/* 얄은 마커 — 떡칠한 형광펜이 아니라 밑줄처럼 깔립니다 */
/* 금액은 그린 글자로 꽉 잡습니다. #00CA71은 1.97:1이라 못 쓰고 #00794A(5.48:1)를 씁니다. */
/* 🔴 v23.22 — 히어로 금액을 그린에서 잉크로 되돌렸습니다.
   금액은 「강조」가 아니라 「본문 중 가장 큰 글자」입니다. 크기·굵기가 이미 위계를 만듭니다.
   그린을 글자로 쓰면 브랜드색이 상태 신호(선택·활성)와 겹쳐 의미가 흐려집니다. */
.rhead-amount > span{color:var(--ink)}
.rhead-amount .u{color:var(--ink-3);font-weight:400}
.rhead-amount{position:relative;display:inline-block;
  font-size:clamp(32px,11vw,var(--d1));line-height:1.1;font-weight:900;
  letter-spacing:-.04em;margin:8px 0 0}
.rhead-amount > span{white-space:nowrap}
.u{font-style:normal;font-size:.72em;font-weight:300;color:var(--ink-3);letter-spacing:-.01em;margin-left:.05em}
.rhead-tail{display:inline-block;font-style:normal;font-size:var(--t4);font-weight:300;color:var(--ink-3);
  color:var(--ink-3);letter-spacing:-.02em;margin-left:7px;vertical-align:baseline}
/* 🔴 v23.21 — 굵은 세로선(3px)을 지웠습니다. 위계는 「선」이 아니라 「면」으로 만듭니다.
   평상시는 중립 틴트, 한도에 걸렸을 때만 오렌지 틴트 + 오렌지 글자로 갈립니다. */
.rhead-why{display:block;margin:16px 0 0;padding:12px 14px;border-radius:var(--r-m);
  background:var(--ink-tint);font-size:var(--t6);font-weight:600;
  color:var(--ink-2);line-height:1.6}
.rhead-why.bad{background:var(--warn-tint);color:var(--warn)}
.condbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.condchip{display:inline-flex;align-items:center;gap:6px;padding:9px 11px 9px 13px;border-radius:var(--r-pill);
  background:var(--card);border:1px solid var(--line);font-size:var(--t7);font-weight:700;color:var(--ink-2);
  letter-spacing:-.02em;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.condchip:hover{border-color:var(--ink-4);color:var(--ink)}
.condchip:active{background:var(--fill);transform:scale(.97)}
.condchip .cc{font-size:9px;color:var(--ink-4);font-weight:400;margin-left:1px}
.condchip:hover .cc{color:var(--ink)}
.condchip u{text-decoration:none;color:var(--ink-4);font-weight:600}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--gap)}
.tile{background:var(--card);border-radius:var(--r-l);padding:var(--pad);box-shadow:var(--sh)}
.tile.wide{grid-column:1 / -1}
.tile-k{font-size:var(--t7);font-weight:500;color:var(--ink-4);margin:0;letter-spacing:.04em}
.tile-v{font-size:var(--t1);line-height:1.15;font-weight:900;letter-spacing:-.04em;margin:10px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-s{font-size:var(--t7);font-weight:300;color:var(--ink-4);margin:7px 0 0}

.card{margin-top:var(--gap);background:var(--card);border-radius:var(--r-xl);padding:var(--pad);box-shadow:var(--sh)}
.card-title{font-size:var(--t4);font-weight:800;line-height:1.3;letter-spacing:-.025em;margin:0 0 20px}
/* 안내 박스는 수수하게, 접기 버튼은 누를 수 있게 — 둘을 갈라 놓습니다.
   🔴 v23.21 — 왼쪽 굵은 세로선(3px)을 전부 지웠습니다. 레거시 인용문 문법입니다.
   중립 안내는 선도 면도 없이 글자만, 주의 안내는 「면」으로만 갈립니다. */
.tip{margin-top:18px;padding:14px 0;border-radius:0;background:transparent;
  border:0;font-size:var(--t7);line-height:1.75;color:var(--ink-3)}
.tip b{color:var(--ink-2);font-weight:800}
/* 규제지역 안내는 「정보」가 아니라 「주의」입니다. 면과 글자로 위계를 만듭니다. */
.tip.info{background:var(--warn-tint);border:0;
  border-radius:var(--r-m);padding:14px 16px;color:var(--warn);font-weight:600}
.tip.info b{color:var(--warn)}

.stack{height:12px;border-radius:var(--r-pill);overflow:hidden;display:flex;background:var(--fill);margin-top:16px}
.stack i{height:100%;display:block;transition:width .55s cubic-bezier(.22,1,.36,1)}
.stack i.f1{background:var(--ink)} .stack i.f2{background:var(--green)}
.stack i.f1 + i.f2{box-shadow:inset 2px 0 0 var(--card)}
.legend{margin-top:16px;display:flex;gap:22px}
.legend div{display:flex;align-items:center;gap:8px;font-size:var(--t7);color:var(--ink-3)}
.legend span{width:8px;height:8px;border-radius:3px;flex:none}
.legend .f1{background:var(--ink)} .legend .f2{background:var(--green)}
.legend b{font-size:var(--t6);font-weight:800;color:var(--ink)}

.line{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:11px 0;font-size:var(--t6)}
.line .v{white-space:nowrap}
.line .k{color:var(--ink-3);font-weight:300} .line .v{font-weight:700;color:var(--ink-2)}
.line.minus .v{color:var(--ink)}
.line.total{border-top:1px solid var(--line);margin-top:12px;padding-top:20px}
.line.total .k{font-size:var(--t5);font-weight:800;color:var(--ink)}
.line.total .v{font-size:var(--t3);font-weight:800;letter-spacing:-.04em}
.overnote{margin-top:14px;padding:12px 14px;border:0;border-radius:var(--r-m);
  background:var(--warn-tint);
  font-size:var(--t7);line-height:1.6;font-weight:600;color:var(--warn)}
.overnote b{font-weight:800}

.gauge{height:8px;border-radius:var(--r-pill);background:var(--fill);margin-top:14px;overflow:hidden}
.gauge i{display:block;height:100%;transition:width .55s cubic-bezier(.22,1,.36,1)}
/* 🔴 v23.20 — 「부담」에 초록을 쓰지 않습니다. 낮음은 색이 아니라 「조용함」으로 말합니다.
   무채색 → 오렌지 → 딥 레드. 명도 사다리가 아니라 **채도 사다리**입니다.
   v23.18~19의 그린 ok는 「부담이 낮다」를 「좋다」로 바꿔 읽게 만들었습니다. */
.gauge i.ok{background:var(--ok)} .gauge i.mid{background:var(--warn)} .gauge i.bad{background:var(--bad)}
.tile-v.ok{color:var(--ok)} .tile-v.mid{color:var(--warn)} .tile-v.bad{color:var(--bad)}

.limitrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.limitrow .k{font-size:var(--t7);color:var(--ink-4);min-width:80px;flex:none}
.limitrow .bar{flex:1;height:8px;border-radius:var(--r-pill);background:var(--fill);overflow:hidden}
.limitrow .bar i{display:block;height:100%;background:var(--line)}
.limitrow .v{font-size:var(--t7);font-weight:700;color:var(--ink-3);min-width:76px;text-align:right;flex:none}
.limitrow.bind .bar i{background:var(--espresso)}
.limitrow.bind .k,.limitrow.bind .v{color:var(--ink);font-weight:800}

/* 회색 박스를 벗깁니다 — 아코디언은 버튼이 아니라 리스트 줄에 가깝습니다.
   투명 면 + 헤어라인 하나로 「열고 닫는 줄」임을 말합니다. */
.disc{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;
  padding:17px 2px;border-radius:0;background:transparent;border:0;border-top:1px solid var(--line);
  font-size:var(--t6);font-weight:700;color:var(--ink);transition:.14s}
.disc:hover .caret{color:var(--ink)}
.disc .caret{transition:transform .22s,color .14s;font-size:var(--t7);color:var(--ink-4)}
.disc[aria-expanded="true"] .caret{transform:rotate(180deg);color:var(--ink)}
.costbox{display:none;margin-top:12px;margin-bottom:8px} .costbox.open{display:block}
/* ⚠ 선은 --line, 면은 --fill입니다. 여기서 --fill을 선으로 쓰고 있었습니다(토큰 혼용). */
.costrow{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.costrow:last-of-type{border-bottom:0}
.costrow .nm{flex:1;min-width:0;font-size:var(--t6);font-weight:600;color:var(--ink-2)}
.costrow .nm small{display:block;font-size:var(--t7);font-weight:400;color:var(--ink-4);margin-top:3px;line-height:1.6}
.costrow .amt{width:98px;flex:none;display:flex;align-items:baseline;gap:0;
  border-radius:10px;padding:9px 11px;background:var(--fill)}
.costrow .amt input{width:100%;border:0;padding:0;background:none;text-align:right;
  font-size:var(--t6);font-weight:700;color:var(--ink)}
.costrow .amt input:focus{outline:none}
.costrow .amt input:disabled{color:var(--ink-4)}
.costrow .amt u{text-decoration:none;font-size:var(--t7);color:var(--ink-4);flex:none}
.costrow .fixed{width:98px;flex:none;text-align:right;font-size:var(--t6);font-weight:700;color:var(--ink-2)}
.sw{width:46px;height:27px;flex:none;border-radius:var(--r-pill);background:var(--line);position:relative;transition:background .18s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:var(--r-pill);
  background:var(--card);
  /* 손잡이 전용 그림자 — 카드용 --sh를 재사용하면 입체감이 죽습니다 */
  box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.10);
  transition:transform .18s}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(19px)}

.slider-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.slider-head .k{font-size:var(--t7);font-weight:700;color:var(--ink-4)}
.slider-head .v{font-size:var(--t3);font-weight:800}
/* 슬라이더 — 브라우저 기본 스타일을 전부 덮습니다.
   채워진 구간은 JS가 --fill-pct를 갱신해 그립니다. */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--r-pill);
  outline:none;cursor:pointer;
  background:linear-gradient(to right, var(--green) 0 var(--fill-pct,0%), var(--line) var(--fill-pct,0%) 100%)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:var(--r-pill);background:transparent}
input[type=range]::-moz-range-track{height:6px;border-radius:var(--r-pill);background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:var(--r-pill);background:var(--green)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;
  border-radius:var(--r-pill);background:var(--card);border:0;
  box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.10);cursor:pointer;transition:transform .12s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:var(--r-pill);background:var(--card);
  border:0;box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.10);cursor:pointer}
.tweak + .tweak{margin-top:26px}
.tweak-label{font-size:var(--t7);font-weight:700;color:var(--ink-4);margin:0 0 12px}
.quote-k{font-size:var(--t7);font-weight:700;color:var(--ink-3);margin:0}
.quote{font-size:clamp(28px,8.5vw,var(--t1));font-weight:800;letter-spacing:-.04em;
  margin:8px 0 0;white-space:nowrap;color:var(--espresso)}

.mini{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;margin-top:16px;
  border-radius:var(--r-m);background:var(--fill);text-align:left;transition:.14s}
.mini:hover{background:var(--line)}
/* 2×2 바둑판 — 세로 4단은 스크롤만 먹고 밀도가 죽습니다.
   ⚠ 폭이 절반이 되므로 제목·설명 글자 크기를 함께 내려야 넘치지 않습니다(원칙 34). */
.minigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minigrid .mini{flex-direction:column;align-items:flex-start;gap:6px;margin-top:0;padding:15px 14px;
  min-height:118px}
.minigrid .mini .txt{width:100%}
.minigrid .mini .txt b{font-size:var(--t7);line-height:1.4}
.minigrid .mini .txt span{font-size:11.5px;line-height:1.6;margin-top:5px}
.minigrid .mini .arw{align-self:flex-end;margin-top:auto;color:var(--ink)}
.mini em{font-style:normal;font-size:var(--t3);flex:none}
.mini .txt{flex:1;min-width:0}
.mini .txt b{display:block;font-size:var(--t6);font-weight:700;color:var(--ink);line-height:1.45}
.mini .txt span{display:block;margin-top:4px;font-size:var(--t7);font-weight:300;color:var(--ink-3);line-height:1.6}
.mini .arw{flex:none;font-size:var(--t6);color:var(--ink-4)}
/* 채널 C 제휴 — 색을 쓰지 않습니다. 흰 면 + 얇은 윤곽 + ↗ 로만 가릅니다(원칙 62). */
.mini.amber{background:var(--card);border:var(--hair);box-shadow:var(--sh)}
.mini.amber .txt b,.mini.amber .arw{color:var(--ink)}
.mini.amber .txt span{color:var(--ink-3)}
.mini.amber:hover{background:var(--fill)}
.mini.sm{padding:16px 18px;margin-top:16px;background:var(--card);border:var(--hair);box-shadow:var(--sh)}
.mini.sm em{font-size:var(--t5)} .mini.sm .txt b{font-size:var(--t7)}

/* 둘러싸던 회색 박스를 걷어냈습니다 — 가짜 버튼처럼 보였습니다 */
.trust{margin:26px 0 0;padding:0;background:none;text-align:center;
  font-size:12px;line-height:1.7;font-weight:400;color:var(--ink-3);
  word-break:keep-all;overflow-wrap:anywhere}
/* 고스트 버튼 — 배경이 --fill이면 앱 배경(--bg)과 같은 값이라 글자만 떠 있는 것처럼 보였습니다.
   흰 면 + 1px 테두리 + 그림자로 덩어리를 만듭니다. */
/* 🔴 v23.21 — 거대한 버튼 둘을 위아래로 쌓던 것을 **가로 2분할**로 바꿨습니다.
   세로 112px + 여백을 먹으면서 시선이 두 번 내려갔습니다.
   왼쪽 35%(세컨더리 · 옅은 면) / 오른쪽 65%(프라이머리 · 솔리드). 엄지 구역 안에 둘 다 들어옵니다. */
.restartrow{display:flex;gap:10px;margin-top:var(--gap)}
.restartrow > button{height:56px;margin-top:0}
.restartrow .reedit-cta{flex:35 1 0}
.restartrow .restart-cta{flex:65 1 0}
/* ⚠ 세컨더리 면을 --fill로 내리면 앱 배경(--bg)과 1.02:1이라 버튼이 통째로 사라집니다(원칙 97).
   「옅은 Secondary」는 여기서 --card(흰 면) + 헤어라인 + 그림자입니다. */
.reedit-cta{width:100%;height:54px;margin-top:var(--gap);border-radius:var(--r-m);
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--sh);
  font-size:var(--t6);font-weight:700;letter-spacing:-.02em;transition:.14s;
  padding:0 6px;white-space:nowrap}
.reedit-cta:hover{background:var(--fill);color:var(--ink);box-shadow:var(--sh-lift)}
.restart-cta{width:100%;height:58px;margin-top:10px;border-radius:var(--r-m);
  background:var(--espresso);color:var(--card);box-shadow:var(--sh-lift);
  font-size:var(--t5);font-weight:800;letter-spacing:-.02em;transition:.14s;
  padding:0 6px;white-space:nowrap}
.restart-cta:hover{background:var(--espresso-2)}
.foot{padding:8px 12px 0;text-align:center;font-size:12px;line-height:1.7;color:var(--ink-3)}
.foot .legal{display:block;margin:0;color:var(--ink-3);font-weight:400;
  word-break:keep-all;overflow-wrap:anywhere}
/* ⏹ .cta.ghost · .textbtn 은 v23.22에서 삭제했습니다 — 어떤 마크업도 쓰지 않는 죽은 규칙입니다.
   죽은 CSS는 죽은 값이 아니라 「살아 있는 두 번째 정의」입니다(원칙 84 · 지침 6-6). */

/* ── 공유용 진단서 (화면 밖에서 렌더) ───────── */
.reportwrap{position:fixed;left:0;top:0;width:440px;height:0;overflow:hidden;
  opacity:0;pointer-events:none;z-index:-1}
.report{width:440px;background:var(--card);border-radius:28px;overflow:hidden}
.report-top{background:linear-gradient(135deg,var(--grad-1) 0%,var(--grad-2) 100%);color:var(--card);padding:38px 34px 34px}
.report-brand{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--bronze-hi);margin:0}
.report-cond{font-size:14px;font-weight:600;color:var(--line);margin:20px 0 0}
.report-label{font-size:14px;font-weight:500;color:var(--line);margin:14px 0 0}
.report-amount{font-size:46px;line-height:1.12;font-weight:800;letter-spacing:-.05em;margin:8px 0 0}
.report-body{padding:30px 34px 34px}
.report-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;font-size:14px}
.report-line + .report-line{border-top:1px solid var(--line)}
.report-line .k{color:var(--ink-3)} .report-line .v{font-weight:700;color:var(--ink)}
.report-note{margin:22px 0 0;padding:15px 17px;border-radius:14px;background:var(--fill);
  font-size:11.5px;line-height:1.7;color:var(--ink-3)}
</style>
</head>

<script>
function formatWon(n){
  const neg = n < 0;
  n = Math.round(Math.abs(n));
  let eok = Math.floor(n / 100000000);
  let man = Math.round((n % 100000000) / 10000);
  if(man >= 10000){ eok += 1; man -= 10000; }   // 반올림으로 만원단위가 1억이 되는 경우 보정
  let str = '';
  if(eok > 0) str += eok.toLocaleString() + '억 ';
  if(man > 0 || eok === 0) str += man.toLocaleString() + '만';
  return (neg ? '-' : '') + str.trim() + '원';
}

const POLICY = {

  /* LTV — 규제지역(reg)과 수도권(metro)의 적용 기준이 다릅니다.
     출처: 국토교통부 2025.10.15 가계부채 관리방안 / 확인일 2026.08.05 */
  ltv: {
    multi:        {reg: 0,    other: 0.6},   // 2주택 이상: 규제지역 대출 금지
    noneOrDispose:{reg: 0.4,  other: 0.7},   // 무주택 · 처분조건부
    firstTime:    {metro: 0.7, other: 0.8}   // 생애최초는 '수도권' 기준(규제지역 아님)
  },

  /* 서민·실수요자 우대 — 규제지역 한정, LTV 60%
     주택가격 상한은 투기과열지구 9억 / 조정대상지역 8억이나, 여기서는 9억으로 단일 적용합니다.
     출처: 은행권 여신심사 운영기준 / 확인일 2026.08.05 */
  seomin: {ltv: 0.6, incomeCap: 90000000, priceCap: 900000000},

  /* 집값 구간별 대출한도 — 기준은 **'수도권 또는 규제지역'**(합집합)입니다.
     즉 ①수도권이면 규제지역이 아니어도(인천·경기 나머지) 걸리고,
        ②수도권 밖이라도 규제지역이면 걸립니다. '그 외 지역'만 해당 없어요.
     코드에서는 c.metro(= zone !== 'other')로 판정합니다. 현재 규제지역은 전부 수도권 안에 있어요.

     ⚠ 보도자료의 "수도권·규제지역"을 교집합(수도권이면서 규제지역)으로 읽으면
        인천·경기 비규제에서 한도가 실제보다 크게 나옵니다 — 유리한 쪽 오차라 특히 위험해요(원칙 28).
        합집합인 근거 셋:
        1) 같은 보도자료가 바로 다음 항목에서 "수도권 **및** 규제지역 내 주담대에 한해
           스트레스 금리를 1.5%→3.0%"로 적습니다. `·`와 `및`을 같은 뜻으로 씁니다.
        2) 10·15 시점 규제지역은 서울 전역+경기 12곳으로 전부 수도권 안이라,
           교집합이면 "규제지역"과 같은 말이 됩니다. 앞 단어를 쓸 이유가 없어요.
        3) 6·27 대책으로 6억 한도가 처음 생겼을 때 규제지역은 강남3구·용산 넷뿐이었는데,
           인천·경기 비규제에도 6억 한도가 적용됐습니다. 교집합이면 설명되지 않아요.

     출처: 관계부처 합동 「10·15 주택시장 안정화 대책」(2025.10.15 발표, 2025.10.16 시행)
           — 수도권·규제지역에 적용되는 주택구입목적 주담대 한도를 집값 구간별로 차등 적용
           대한민국 정책브리핑 6·27 대책 보도(2025.06.27) — 대비되는 말이 '지방'이지 '비규제'가 아님
     확인일 2026.08.06 (재확인) */
  bandCap: [
    {upTo: 1500000000, cap: 600000000},
    {upTo: 2500000000, cap: 400000000},
    {upTo: Infinity,   cap: 200000000}
  ],

  /* 상환능력 비율 — 은행 주담대는 스트레스 DSR 40%, 정책대출은 DTI 60% */
  ratio: {dsr: 0.40, dti: 0.60},

  /* 방공제(소액임차보증금 공제) 기본값. 실제 4단 구간은 #roomDeduct가 관리합니다.
     출처: 주택임대차보호법 시행령 제10조 / 확인일 2026.08.05 */
  roomDeduct: {reg: 5500, metro: 4800, other: 2800, fallbackWon: 28000000},

  /* 취득세 — 중과는 '규제지역'(조정대상지역) 기준
     출처: 지방세법 제11조·제13조의2, 지방세법 시행령 / 확인일 2026.08.05 */
  acqTax: {
    heavyMulti:  {reg: 0.12, other: 0.08},   // 2주택 이상
    generalLow:  0.01,                        // 6억 이하
    generalHigh: 0.03,                        // 9억 초과
    slopeFrom:   600000000,                   // 6억~9억 선형 구간 시작

/* POLICY를 유일한 출처로 두고, 기존 이름은 별칭으로만 남깁니다.
   호출부를 한꺼번에 바꾸면 되돌리기 어려워서, 이름은 유지하고 값의 출처만 옮겼어요. */
const ROOM_DEDUCT_DEFAULT = POLICY.roomDeduct;

/* ===== POLICY 값을 화면 문구로 옮기는 표기 규칙 (원칙 45·46) =====
   정책 수치를 문장에 손으로 다시 적지 않기 위한 포맷터입니다.
   문단을 하나씩 고치는 대신 규칙 하나를 세워 전수 적용해요.

   1억 이상 → '5억' '1.3억' '5.11억'  (백만원 자리에서 반올림)
   1억 미만 → '6천만원' '8,500만원'   (딱 떨어지면 '천만원', 아니면 만원 단위) */
function policyAmount(won){
  if(won >= 100000000) return String(Math.round(won / 1000000) / 100) + '억';
  const man = Math.round(won / 10000);
  if(man >= 1000 && man % 1000 === 0) return (man / 1000) + '천만원';
  return man.toLocaleString() + '만원';
}

/* 구간별 대출한도(수도권 기준)를 문장에 쓰는 두 가지 형태.
   POLICY.bandCap을 고치면 화면 문구가 같이 바뀝니다. */
function bandCapAmounts(){                    // '6억/4억/2억'
  return POLICY.bandCap.map(function(b){ return policyAmount(b.cap); }).join('/');
}
function bandCapRanges(){                     // '15억 이하 6억 · 25억 이하 4억 · 초과 2억'
  return POLICY.bandCap.map(function(b){
    return (b.upTo === Infinity ? '초과' : policyAmount(b.upTo) + ' 이하') + ' ' + policyAmount(b.cap);
  }).join(' · ');
}

const BABY_RATE_TABLE = [
  {upto:  20000000, dual:false, r:[1.80, 1.90, 2.00, 2.05]},

  {upto: 150000000, dual:true,  r:[3.50, 3.60, 3.70, 3.80]},
  {upto: 170000000, dual:true,  r:[3.85, 3.95, 4.05, 4.15]},
  {upto: 200000000, dual:true,  r:[4.20, 4.30, 4.40, 4.50]}
];
const BABY_TERMS = [10, 15, 20, 30];

function babyRate(income, years, metro){  /* 지방(수도권 밖) 소재 주택 0.2%p 인하 */
  const col = BABY_TERMS.indexOf(nearestBabyTerm(years));
  const row = BABY_RATE_TABLE.find(x => income <= x.upto);
  if(!row || col < 0) return null;
  // 지방 소재 주택은 0.2%p 인하
  return Math.round((row.r[col] - (metro ? 0 : 0.2)) * 100) / 100;
}
function nearestBabyTerm(years){
  let best = BABY_TERMS[0];
  for(const t of BABY_TERMS){ if(years >= t) best = t; }
  return best;
}

/* 보금자리론 기준금리 (공시 2026.08.01, 연 %) — 만기별 */
const BOGEUM_TERMS = [10, 15, 20, 30, 40, 50];
const BOGEUM_BASE = {
  'akkime': {label:'아낌e보금자리론', desc:'전자약정·전자등기 방식', r:[4.90, 5.00, 5.05, 5.10, 5.15, 5.20]},

  't':      {label:'t-보금자리론',     desc:'은행 방문 대면 신청',    r:[5.00, 5.10, 5.15, 5.20, 5.25, 5.30]}
};
const BOGEUM_PREF_CAP = 1.0;          // 우대금리 합계 한도
const BOGEUM_REGULATED_ADD = 0.2;     // 규제지역 소재 가산

function nearestBogeumTerm(years){
  let best = BOGEUM_TERMS[0];
  for(const t of BOGEUM_TERMS){ if(years >= t) best = t; }
  return best;
}

/* 입력값으로 확인 가능한 우대 항목만 계산해요.
   장애인·다문화·한부모·녹색건축물·전세사기피해자 등은 별도 확인이 필요해서 빼요. */
function bogeumPreferences(p){
  const list = [];
  const lowIncome = p.income > 0 && p.income <= 70000000;
  // 신생아 출산가구(0.2)와 신혼가구(0.3)는 중복 적용이 안 돼서 더 큰 쪽만 담아요
  if(lowIncome && p.newlywed) list.push({name:'신혼가구', bp:0.3});
  else if(lowIncome && p.newborn) list.push({name:'신생아 출산가구', bp:0.2});
  if(p.childCount >= 3) list.push({name:'다자녀가구(3자녀 이상)', bp:0.7});
  else if(p.childCount === 2) list.push({name:'다자녀가구(2자녀)', bp:0.5});
  // 각 항목별 최대 2가지까지 중복 적용
  list.sort((a,b)=> b.bp - a.bp);
  return list.slice(0, 2);
}

function bogeumRate(p, years, product){
  const col = BOGEUM_TERMS.indexOf(nearestBogeumTerm(years));
  const base = BOGEUM_BASE[product || 'akkime'];
  if(!base || col < 0) return null;
  const prefs = bogeumPreferences(p);
  let discount = Math.min(BOGEUM_PREF_CAP, prefs.reduce((a,b)=> a + b.bp, 0));
  // 전자약정·전자등기 우대는 한도와 별도로 추가 적용
  if((product || 'akkime') === 'akkime') discount += 0.1;
  const add = p.regulated ? BOGEUM_REGULATED_ADD : 0;   /* 규제지역(조정대상지역·투기과열지구) 소재 가산 */
  return {
    rate: Math.round((base.r[col] + add - discount) * 100) / 100,
    base: base.r[col], add, discount, prefs, label: base.label,
    term: nearestBogeumTerm(years)
  };
}


const STRESS = {
  variable: { capital: 3.00, local: 0.75 },              // 변동형: 산출값 그대로
  mixed:    { capital: [2.40, 1.80, 1.20, 0],            // 혼합형
              local:   [0.45, 0.30, 0.15, 0] },
  periodic: { capital: [1.20, 0.90, 0.60, 0],            // 주기형
              local:   [0.23, 0.15, 0.08, 0] },
  credit:   { threshold: 100000000, rate: 1.50 }         // 신용대출: 잔액 1억 초과 시 1.50%
};

function fixedRatioBucket(fixedYears, totalYears){
  if(!(totalYears > 0)) return 0;
  const r = fixedYears / totalYears;
  if(r < 0.30) return 0;
  if(r < 0.50) return 1;
  if(r < 0.70) return 2;
  return 3;
}

function computeStressBp(metro, rateType, fixedYears, totalYears){
  const zone = metro ? 'capital' : 'local';
  if(rateType === 'variable') return STRESS.variable[zone];
  const table = STRESS[rateType];
  if(!table) return STRESS.variable[zone];
  return table[zone][fixedRatioBucket(fixedYears, totalYears)];
}

function stressExplain(metro, rateType, fixedYears, totalYears){
  const zoneLabel = metro ? '수도권(규제지역 포함)' : '그 외 지역';
  if(rateType === 'variable'){
    return `${zoneLabel} 변동형 기준이에요. 산출된 스트레스 금리가 그대로 적용돼요.`;
  }
  const b = fixedRatioBucket(fixedYears, totalYears);
  const typeLabel = rateType === 'mixed' ? '혼합형' : '주기형';
  if(b === 3){
    return `고정금리 기간이 만기의 70% 이상이라 스트레스 금리가 적용되지 않아요(${zoneLabel} ${typeLabel}).`;
  }
  const bucketLabel = ['30% 미만', '30~50%', '50~70%'][b];
  return `${zoneLabel} ${typeLabel} · 고정기간이 만기의 ${bucketLabel}인 구간이에요.`;
}

function applyStressDefault(){
  const el = document.getElementById('stressBp');
  if(!el) return;
  const metro  = isMetro();
  const rateType   = document.getElementById('rateType').value;
  const totalYears = parseFloat(document.getElementById('years').value) || 30;
  const fixedYears = parseFloat(document.getElementById('fixedYears').value) || 0;

  // 고정금리기간 입력칸은 혼합형·주기형에서만 의미가 있어요
  const fw = document.getElementById('fixedYearsField');
  if(fw) fw.style.display = (rateType === 'variable') ? 'none' : 'block';

  if(!el.dataset.touched){
    el.value = computeStressBp(metro, rateType, fixedYears, totalYears);
  }
  const note = document.getElementById('stressNote');
  if(note) note.textContent = stressExplain(metro, rateType, fixedYears, totalYears);
}

/* 기본값은 ①(우대 최대)과 ②상단(우대 없음) 사이에서 보수적으로 잡은 값이에요.
   시장 평균이 아니고, 계산 결과가 실제보다 넉넉하게 나오지 않도록 고른 값이에요. */
const RATE_DEFAULT = 5.4;

function getLTV(houseStatus, reg, metro){
  /* reg   = 규제지역(투기과열지구·조정대상지역) → LTV 강화가 여기만 적용돼요
     metro = 수도권(규제지역 포함)               → 생애최초 LTV 상한이 여기 기준이에요 */
  const L = POLICY.ltv;
  if(houseStatus === 'multi') return reg   ? L.multi.reg      : L.multi.other;
  if(houseStatus === 'first') return metro ? L.firstTime.metro : L.firstTime.other;
  return reg ? L.noneOrDispose.reg : L.noneOrDispose.other;   /* 무주택 · 처분조건부 */
}

function isSeominEligible(ctx){
  // 서민·실수요자: 무주택 세대주 + 부부합산 연소득 9천만원 이하 + 주택가격 8~9억 이하(투기과열지구 9억/조정대상지역 8억, 여기선 9억 기준 적용) — 규제지역 한정, LTV 60% 우대
  if(!ctx.regulated || !ctx.seominCheck) return false;   /* 서민·실수요자 우대는 규제지역 한정 */
  if(ctx.houseStatus !== 'none') return false;
  if(!ctx.incomeEntered || ctx.income > POLICY.seomin.incomeCap) return false;
  if(ctx.price > POLICY.seomin.priceCap) return false;
  return true;
}

function getEffectiveLTV(ctx){
  if(isSeominEligible(ctx)) return POLICY.seomin.ltv;
  return getLTV(ctx.houseStatus, ctx.regulated, ctx.metro);
}

/* ===== 상환부담(DSR·DTI) 엔진 =====
   실제 대출한도를 결정하는 건 LTV가 아니라 상환능력인 경우가 대부분이라,
   LTV 한도와 상환능력 한도 중 "더 작은 쪽"을 최종 한도로 잡아요.

   · 은행 주담대  : 스트레스 DSR 40% (기존 모든 대출의 연 원리금을 합산)
   · 정책대출     : DSR 규제 대상이 아니고 DTI 60%를 적용 (주담대 원리금 + 기타대출 이자)
   · 스트레스 금리: 가산폭은 시기·지역별로 바뀌므로 사용자가 조정할 수 있게 열어둠 */

const DSR_RATIO = POLICY.ratio.dsr;
const DTI_RATIO = POLICY.ratio.dti;

function annualPayment(loan, ratePct, years){
  return monthlyPaymentCalc(loan, ratePct, years) * 12;
}

/* 기존 부채가 DSR에서 차지하는 연간 원리금.
   신용대출은 DSR 산정 시 통상 10년 분할상환으로 간주해요. */
function existingAnnualDebt(ctx){
  let sum = 0;
  const r = ctx.rate > 0 ? ctx.rate : 4.5;
  if(ctx.creditLoan > 0){
    /* 신용대출은 DSR 산정 시 통상 10년 분할상환으로 간주해요.
       스트레스 금리는 신용대출 전체 잔액이 1억원을 초과할 때만 붙고(1.50%),
       주담대용 3.0%가 아니라 산출 기준값 1.50%를 써요. */
    const cs = ctx.creditLoan > STRESS.credit.threshold ? STRESS.credit.rate : 0;
    sum += annualPayment(ctx.creditLoan, r + cs, 10);
  }
  if(ctx.otherDebtMonthly > 0) sum += ctx.otherDebtMonthly * 12;
  // 사내대출·셀러파이낸싱은 통상 DSR 산정 대상이 아니라 제외
  return sum;
}

/* 연간 상환능력 안에서 빌릴 수 있는 원금을 역산 */
function loanFromCapacity(annualCapacity, ratePct, years){
  if(annualCapacity <= 0) return 0;
  const perUnit = annualPayment(1000000, ratePct, years) / 1000000;
  if(perUnit <= 0) return 0;
  return annualCapacity / perUnit;
}

function repaymentCapLimit(ctx, isPolicy){
  if(!ctx.incomeEntered || ctx.income <= 0) return {limit: Infinity, applied: false, kind: null};
  const years = ctx.years > 0 ? ctx.years : 30;
  const baseRate = ctx.rate > 0 ? ctx.rate : 4.5;

  if(isPolicy){
    /* 정책대출은 DSR 규제 대상이 아니고 DTI 최대 60%가 적용돼요.
       DTI는 "주담대 원리금 + 기타대출 이자"를 소득으로 나눈 값이라,
       기타 부채는 원금을 빼고 이자 상당액만 반영해요. */
    const otherInterest = (ctx.creditLoan || 0) * (baseRate + 1.5) / 100
                        + (ctx.otherDebtMonthly || 0) * 12 * 0.5;
    const cap = ctx.income * DTI_RATIO - otherInterest;
    return {limit: Math.max(0, loanFromCapacity(cap, baseRate, years)), applied: true, kind: 'DTI'};
  }
  // 은행 주담대: 스트레스 DSR
  const stressRate = baseRate + (ctx.stressBp || 0);
  const cap = ctx.income * DSR_RATIO - existingAnnualDebt(ctx);
  return {limit: Math.max(0, loanFromCapacity(cap, stressRate, years)), applied: true, kind: 'DSR'};
}

/* 방공제(소액임차보증금 최우선변제금)는 실행액에서 차감돼요.
   MCI/MCG 보증에 가입하면 면제되지만, 기본은 차감이 원칙이에요. */
function roomDeduction(ctx){
  if(ctx.mciCovered) return 0;
  return ctx.roomDeductAmt > 0 ? ctx.roomDeductAmt : POLICY.roomDeduct.fallbackWon;
}

function computeLoan(ctx){
  /* 반환값에 limits(각 규제별 한도)와 binding(무엇이 한도를 결정했는지)을 함께 담아요.
     결과화면에서 "당신의 한도를 막는 건 무엇인가"를 보여주기 위한 값이에요. */
  if(ctx.noLoan){
    return {amount:0, type:'none', fellBack:false, cappedByBank:false, limits:{}, binding:'none', roomCut:0};
  }
  const noHouse = (ctx.houseStatus === 'first' || ctx.houseStatus === 'none');
  const firstTime = ctx.houseStatus === 'first';

  const finish = (raw, type, extra) => {
    const limits = raw.limits;
    // 방공제 차감 (정책대출·은행 공통)
    const cut = type === 'none' ? 0 : Math.min(roomDeduction(ctx), raw.amount);
    let amount = Math.max(0, raw.amount - cut);
    let binding = raw.binding;

    if(type === 'bank' && ctx.manualLoanCap > 0 && amount > ctx.manualLoanCap){
      amount = ctx.manualLoanCap;
      binding = 'manual';
      limits.manual = ctx.manualLoanCap;
    }
    return Object.assign({amount, type, limits, binding, roomCut: cut, cappedByBank: binding === 'manual'}, extra || {});
  };

  // --- 후보 한도들 중 가장 작은 값을 고르고, 무엇이 걸렸는지 기록 ---
  const pick = (candidates) => {
    let best = Infinity, key = null;
    for(const k in candidates){
      const v = candidates[k];
      if(v !== null && v !== undefined && isFinite(v) && v < best){ best = v; key = k; }
    }
    return {amount: Math.max(0, best === Infinity ? 0 : best), binding: key, limits: candidates};
  };

  // --- 정책대출 경로 ---
  if(ctx.loanChoice && ctx.loanChoice !== 'bank'){
    const def = POLICY_DEFS[ctx.loanChoice];
    const infoMissing = !ctx.incomeEntered || !ctx.pyeongEntered;
    const p = {
      price: ctx.price, income: ctx.income, newlywed: ctx.newlywed, newborn: ctx.newborn,
      multiChild: ctx.multiChild, childCount: ctx.childCount,
      noHouse, firstTime, upToOneHouse: (ctx.houseStatus !== 'multi'),
      regulated: ctx.regulated, metro: ctx.metro, dualIncome: ctx.dualIncome, pyeongM2: ctx.pyeongM2
    };
    if(!infoMissing && def && def.eligible(p)){
      const dti = repaymentCapLimit(ctx, true);
      const raw = pick({
        LTV: p.price * def.ltv(p),
        상품한도: def.cap(p),
        DTI: dti.applied ? dti.limit : null
      });
      return finish(raw, ctx.loanChoice, {fellBack:false});
    }
    const raw = bankLimits(ctx);
    return finish(raw, 'bank', {fellBack:true, fellBackReason: infoMissing ? 'missing' : 'ineligible'});
  }

  // --- 일반 은행 주담대 ---
  return finish(bankLimits(ctx), 'bank', {fellBack:false});

  function bankLimits(c){
    const ltv = getEffectiveLTV(c);
    const cands = {LTV: c.price * ltv};
    /* 집값 구간별 대출한도는 "수도권·규제지역"에 적용돼요(2025.10.15 대책).
       규제지역이 아니어도 인천·경기라면 걸려요. */
    if(c.metro){
      const band = POLICY.bandCap.find(function(b){ return c.price <= b.upTo; });
      if(band) cands['구간한도'] = band.cap;
    }
    if(c.bankSelfCap > 0) cands['은행자체한도'] = c.bankSelfCap;
    const dsr = repaymentCapLimit(c, false);
    if(dsr.applied) cands.DSR = dsr.limit;
    return pick(cands);
  }
}

function acquisitionTaxRate(price, houseStatus, regulated){
  const eok = price / 100000000;
  /* 중과는 조정대상지역(=규제지역) 기준.
     ⚠ 알려진 단순화: "2주택 이상"을 한 칸으로 받기 때문에, 비조정지역에서
     정확히 2주택이 되는 경우(실제로는 일반세율 1~3%)에도 8%로 계산해요.
     보수적인 방향이라 남겨두되, 화면에 한계를 표시해요. */
  const A = POLICY.acqTax;
  if(houseStatus === 'multi') return regulated ? A.heavyMulti.reg : A.heavyMulti.other;
  return generalRate(eok);

  function generalRate(eok){
    const lo = A.slopeFrom / 100000000, hi = A.slopeTo / 100000000;
    if(eok <= lo) return A.generalLow;
    if(eok <= hi) return Math.min(A.generalHigh, Math.max(A.generalLow, (eok * (2/3) - 3) / 100));
    return A.generalHigh;
  }
}

function calcCosts(ctx){
  const baseRate = acquisitionTaxRate(ctx.price, ctx.houseStatus, ctx.regulated);
  let tax = ctx.price * baseRate;

  /* 지방교육세: 표준세율(1~3%) 구간은 취득세액의 10%.
     중과세율(8%·12%) 구간은 0.4% 정액이라 별도 처리. */
  const A = POLICY.acqTax;
  const heavy = (baseRate >= A.heavyMulti.other);
  const eduTax = heavy ? ctx.price * A.eduHeavyFlat : tax * A.eduStandardOfTax;

  /* 농어촌특별세: 전용 85㎡ 초과분에만 부과.
     표준세율 구간 0.2%, 8% 중과 0.6%, 12% 중과 1.0%. */
  let ruralRate = A.rural.standard;
  if(baseRate >= A.heavyMulti.reg) ruralRate = A.rural.heavy12;
  else if(baseRate >= A.heavyMulti.other) ruralRate = A.rural.heavy8;
  const ruralTax = ctx.over85 ? ctx.price * ruralRate : 0;

  let totalTax = tax + eduTax + ruralTax;

  if(ctx.firstTimeTaxCut && ctx.price <= A.firstTimeCut.maxPrice){
    totalTax = Math.max(0, totalTax - A.firstTimeCut.amount);
  }

  const bBand = POLICY.broker.bands.find(function(b){ return ctx.price < b.under; });
  let brokerFee = ctx.price * bBand.rate;
  if(bBand.cap !== null) brokerFee = Math.min(brokerFee, bBand.cap);
  brokerFee = brokerFee * POLICY.broker.vat;   // 중개보수는 부가세 10% 별도 (상한요율 기준, 실제는 협의 가능)

  const interiorCost = ctx.pyeong * ctx.interiorPerPyeong * 10000;
  /* 인테리어비는 평형 × 단가입니다. 두 필드가 서로 다른 소절('집 정보' / '입주 준비 비용')에
     떨어져 있고 평형이 '선택' 항목이라, 단가만 고르고 평형을 비워두면 곱의 한쪽이 0이라
     조용히 0원이 됐어요. 사용자에겐 "골랐는데 반영이 안 된다"로 보입니다.
     → 그 상태를 값으로 들고 나가서 입력·결과 양쪽에서 이유를 말해줍니다. */
  const interiorBlocked = ctx.interiorPerPyeong > 0 && !(ctx.pyeong > 0);
  const etcCost = ctx.etc * 10000;
  const pyeongM2 = ctx.pyeong * POLICY.area.pyeongToM2; // 평형은 통상 공급면적 기준이라, 전용면적 추정 시 전용률(약 74%)을 적용한 근사치예요

  const loanResult = computeLoan({...ctx, pyeongM2});
  const mortgageLoan = loanResult.amount;
  const totalFunding = mortgageLoan + (ctx.extraFunding || 0);

  const totalNeeded = ctx.price + totalTax + brokerFee + interiorCost + etcCost;
  const cashNeeded = totalNeeded - totalFunding;

  return {
    tax: totalTax, brokerFee, interiorCost, etcCost, interiorBlocked,
    mortgageLoan, loanType: loanResult.type, fellBack: loanResult.fellBack, fellBackReason: loanResult.fellBackReason, cappedByBank: loanResult.cappedByBank,
    binding: loanResult.binding, limits: loanResult.limits, roomCut: loanResult.roomCut,
    totalFunding, totalNeeded, cashNeeded
  };
}

function solveMaxPrice(cashAvailable, ctxBase){
  /* cashNeeded(price)는 단조증가가 아니에요.
     정책대출 집값 상한을 넘는 순간 은행 주담대로 전환되면서
     오히려 대출이 늘고 필요현금이 줄어드는 역전 구간이 생기기 때문이에요.
     그래서 단순 이분탐색을 쓰면 낮은 해에 갇혀 최대 매매가를 과소평가해요.
     → 전 구간을 조밀하게 스캔해 "가능한 최댓값"을 찾은 뒤, 그 주변만 정밀화해요. */
  const MAX = 5000000000;
  const STEP = 5000000;              // 500만원 간격 스캔
  const ok = (price) => calcCosts({...ctxBase, price}).cashNeeded <= cashAvailable;

  let best = 0;
  for(let price = STEP; price <= MAX; price += STEP){
    if(ok(price)) best = price;
  }
  if(best === 0) return 0;

  // 찾은 지점 위쪽 STEP 구간을 이분탐색으로 정밀화
  let lo = best, hi = Math.min(best + STEP, MAX);
  for(let i=0;i<40;i++){
    const mid = (lo+hi)/2;
    if(ok(mid)) lo = mid; else hi = mid;
  }
  return lo;
}

function monthlyPaymentCalc(loan, ratePct, years){
  const r = (ratePct/100)/12;
  const n = years*12;
  if(loan <= 0 || n <= 0) return 0;
  if(r === 0) return loan/n;
  return loan * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
}

/* ── 억 / 만 두 칸 입력기 ─────────────────────
   0을 셀 일이 없게 단위를 나눴습니다. 억 칸에 소수점(10.5)을 넣으면
   만 칸으로 자동 분배되고, 만 칸이 10,000을 넘으면 억으로 올려줍니다. */
function attachEokMan(eokEl, manEl, get, set, onSync){
  const paint = () => { onSync && onSync(get()); };
  const spread = total => {
    set(total>0 ? total : null);
    eokEl.value = total>=10000 ? String(Math.floor(total/10000)) : '';
    const r = total%10000;
    manEl.value = r ? comma(r) : '';
    paint();
  };
  const readEok = () => { const n=parseFloat((eokEl.value||'').replace(/[^\d.]/g,'')); return isFinite(n)?n:0; };
  const readMan = () => { const n=parseInt((manEl.value||'').replace(/[^\d]/g,''),10); return isFinite(n)?n:0; };

  eokEl.oninput = () => {
    let raw=(eokEl.value||'').replace(/[^\d.]/g,'');
    const p=raw.split('.'); if(p.length>2) raw=p[0]+'.'+p.slice(1).join('');
    const [a,b]=raw.split('.');
    eokEl.value=(a||'').slice(0,4)+(b!==undefined?'.'+b.slice(0,2):'');
    const t=Math.round(readEok()*10000)+readMan();
    set(t>0?t:null); paint();
  };
  eokEl.onblur = () => spread(Math.round(readEok()*10000)+readMan());
  manEl.oninput = () => {
    const d=(manEl.value||'').replace(/[^\d]/g,'').slice(0,5);
    manEl.value = d?comma(d):'';
    const t=Math.round(readEok()*10000)+(d?+d:0);
    set(t>0?t:null); paint();
  };
  manEl.onblur = () => spread(Math.round(readEok()*10000)+readMan());
  eokEl.addMan = a => spread((get()||0)+a);
  eokEl.clearAll = () => spread(0);
  paint();
}

function bind(){
  const box=$('qBox'), id=STEPS[S.step].id, eokEl=$('inEok'), manEl=$('inMan');
  if(eokEl){
    const field = id==='income' ? 'income' : 'cash';

    const onSync = m => {
      $('readout').textContent = m ? '' : hint;   /* 값이 있으면 비웁니다 */
      syncCta();
    };
    attachEokMan(eokEl, manEl, ()=>S[field], v=>{S[field]=v;}, onSync);
    [eokEl,manEl].forEach(el => el.onkeydown = e => {

  }
  const dl=$('debtLink'), dbt=$('inDebt');
  if(dl){
    dl.onclick = e => { e.preventDefault(); S.debtOpen=!S.debtOpen; renderQuestion(); };
    const paint = () => { const el=$('debtEcho'); if(!el) return;
      el.textContent = S.debtMonthly
        ? '1년이면 ' + formatWon(S.debtMonthly*12*10000) + '을 갚고 있어요. 그만큼 빌릴 수 있는 몫이 줄어요.'
        : ''; };
    if(dbt){
      dbt.oninput = () => { const v=(dbt.value||'').replace(/[^\d]/g,'').slice(0,4);

      box.querySelectorAll('[data-debt]').forEach(b=>b.onclick=e=>{

        S.debtMonthly = add===0 ? null : (S.debtMonthly||0)+add;
        dbt.value = S.debtMonthly?comma(S.debtMonthly):''; paint();
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      });
      paint();
    }
  }
  const nl=$('noLoanBox'); if(nl) nl.onchange=()=>{S.noLoan=nl.checked;
    if(S.noLoan) S.income=null;      /* 소득 단계를 건너뛰므로 값도 비웁니다 */
    renderAnswered(); syncCta(); };
  box.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{
    S.group=b.dataset.group; S.sido = b.dataset.group==='seoul'?SEOUL:''; S.sgg='';
    renderQuestion(); syncCta();
  });
  const seg=$('houseSeg');
  if(seg) seg.querySelectorAll('[data-house]').forEach(b=>b.onclick=()=>{
    S.houseStatus=b.dataset.house;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('is-on', x===b));
    $('houseEcho').textContent = b.dataset.house==='multi'
      ? '다주택자는 취득세가 중과되며, 대출 한도가 크게 축소될 수 있습니다.'
      : b.dataset.house==='first' ? '생애최초 기준이 적용돼 대출 한도가 늘어납니다.' : '';
    syncCta();

  bindPane();
}

function bindingShort(c){

    return ['이 조건에서는 주택담보대출이 나오지 않아요','bad'];
  const B={ DSR:['소득 대비 대출 규제(DSR) 최대 한도에 도달했어요','bad'],
    DTI:['소득 대비 대출 규제(DSR) 최대 한도에 도달했어요','bad'],
    LTV:['주택담보대출 비율(LTV) 최대 한도에 도달했어요',''],

    manual:['은행 자체 한도에 도달했어요','bad'] };
  return B[c.binding] || ['한도가 정해졌어요',''];
}
function bindingTip(c, price){

    return `<b>규제지역에서 집이 이미 있으면 주택담보대출이 막혀요.</b> 지금 금액은 전부 현금으로 마련해야 하는 돈이에요. 「지금 없어요」로 바꾸거나 규제지역 밖을 보면 달라져요.`;

function countTo(el, to){
  const from=el._v||0; el._v=to; el.innerHTML=richWon(to);
  if(Math.abs(to-from)<1 || typeof requestAnimationFrame!=='function') return;
  const t0=Date.now(), dur=440;
  const tick=()=>{ const p=Math.min(1,(Date.now()-t0)/dur), e=1-Math.pow(1-p,3);
    el.innerHTML=richWon(from+(to-from)*e); if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

    if(navigator.share && !navigator.canShare){ await navigator.share({text:txt}); t.textContent='✅ 공유했어요'; }

    if(e && e.name==='AbortError'){ return; }

    catch(e2){ t.textContent='⚠ 복사 실패'; }

/* ═══════════════════════════════════════════
   자가 점검 — 브라우저 콘솔에서 __selfcheck()

window.__selfcheck = function(){
  const R=[], ok=(n,p,d)=>R.push({검사:n, 결과:p?'✅':'🔴', 값:d});
  const moneyRe=/(?:\d[\d,]*억\s?)?[\d,]+만원|\d[\d,]*억원/g;

  /* 🔒 디자인 락 — 토큰이 바뀌었으면 여기서 걸립니다 */
  const LOCK = {'--bg':'#F2F4F6','--card':'#FFFFFF','--grad-1':'#000000','--grad-2':'#191F28',
    '--espresso':'#191F28','--espresso-2':'#000000','--ink':'#191F28',
    '--green':'#00CA71','--line':'#E5E8EB','--fill':'#EEF0F3'};
  const cs=getComputedStyle(document.documentElement);
  const drift=Object.keys(LOCK).filter(k=>cs.getPropertyValue(k).trim().toUpperCase()!==LOCK[k]);
  ok('디자인 락 유지', drift.length===0, drift.join(', ')||'v23.22 그대로');

  const cs2=getComputedStyle(document.documentElement);
  const L=h=>{h=(h||'').trim().replace('#','');if(h.length!==6)return null;
    const c=[0,2,4].map(i=>{let v=parseInt(h.substr(i,2),16)/255;
      return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
    return .2126*c[0]+.7152*c[1]+.0722*c[2];};
  /* 🔴 v23.19 — 여기가 오랫동안 엉뚱한 짝을 재고 있었습니다.
     막대는 .stack i.f1(--ink) / .f2(--green)인데 --espresso ↔ --navy-lift를 비교했습니다.
     둘 다 팔레트에 있던 값이라 숫자가 그럴듯하게 나와 아무도 못 봤습니다(원칙 99).
     이제 실제 두 조각의 토큰을 봅니다. */
  const la=L(cs2.getPropertyValue('--ink')), lb=L(cs2.getPropertyValue('--green'));
  const cr=(la!==null&&lb!==null)?(Math.max(la,lb)+.05)/(Math.min(la,lb)+.05):0;
  ok('막대 두 조각 대비 ≥ 3:1 (원칙 94)', cr>=3, cr.toFixed(2)+' : 1');
  /* 🔴 원칙 97 — 두 토큰의 값이 같아지면 한쪽이 놓인 자리에 따라 통째로 사라집니다.
     v23.19는 카드가 배경에서 분리되는 근거가 「테두리」뿐이라 더 위험합니다. */
  const same=[['--fill','--bg'],['--card','--bg']].filter(([a,b])=>
    cs2.getPropertyValue(a).trim().toUpperCase()===cs2.getPropertyValue(b).trim().toUpperCase());
  ok('G-15 배경 · 면 토큰이 서로 다른 값', same.length===0,
     same.map(p=>p.join(' = ')).join(', ')||'전부 다름');

  /* 🔴 G-16 (v23.22) — 입력 필드가 **자기 뒤에 실제로 깔린 면** 위에서 보이는가.
     흰 베젤(.moneycard)을 지웠으므로, 필드는 이제 질문 카드 위에 바로 놓입니다.
     토큰만 봐서는 안 보입니다 — 부모를 거슬러 올라가 「진짜 칠해진 색」을 재야 걸립니다(원칙 97).
     v23.18의 「0만만 허공에 뜬다」가 정확히 이 자리에서 났습니다. */
  const rgbL=str=>{const m=(str||'').match(/\d+/g); if(!m||m.length<3) return null;
    const c=m.slice(0,3).map(v=>{let x=+v/255; return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});
    return .2126*c[0]+.7152*c[1]+.0722*c[2];};
  const behind=el=>{ for(let n=el.parentElement;n;n=n.parentElement){
    const bg=getComputedStyle(n).backgroundColor;
    if(bg && bg!=='transparent' && !/rgba\(0, 0, 0, 0\)/.test(bg)) return bg; } return 'rgb(255,255,255)'; };
  const fieldFail=[...document.querySelectorAll('.mfield')].filter(el=>{
    if(!el.offsetParent) return false;
    const a=rgbL(getComputedStyle(el).backgroundColor), b=rgbL(behind(el));
    if(a===null||b===null) return true;
    return (Math.max(a,b)+.05)/(Math.min(a,b)+.05) < 1.05;   /* 1.05:1 미만이면 배경에 녹습니다 */
  });
  /* ⚠ 결과 화면·입력 03에는 .mfield가 없습니다. **0개면 조용히 통과한 것**이므로 그렇게 적습니다.
     G-14와 같은 함정입니다 — 입력 01 또는 02에서 한 번 더 돌려야 실제로 재집니다(원칙 99). */
  const fieldSeen=[...document.querySelectorAll('.mfield')].filter(el=>el.offsetParent).length;
  ok('G-16 입력 필드가 뒤 배경과 구분된다', fieldFail.length===0,
     fieldFail.length ? fieldFail.length+'개가 배경에 녹음'
     : fieldSeen ? fieldSeen+'개 확인' : '🟡 측정 대상 0 — 입력 01·02에서 다시 실행하세요');

  /* 🔴 G-17 (v23.22) — 선택해도 상자 크기가 변하지 않는가.
     G-14는 테두리 「폭」만 봅니다. 폭이 같아도 padding·font-weight가 바뀌면 상자가 움직입니다.
     칩을 실제로 켰다 껐다 하며 **렌더된 폭**을 잽니다. */
  /* ⚠ 변수명 주의 — 아래 G-13이 이미 `probe`를 씁니다. 같은 스코프에서 두 번 선언하면
     __selfcheck가 아니라 **스크립트 전체가 죽습니다**(첫 화면이 빈 채로 뜹니다). */
  /* ⚠ 숨은 화면(#qBox·#result)에도 칩이 남아 있습니다. 폭이 0으로 나와 조용히 통과합니다.
     **보이는** 칩만 잡습니다. */
  const chipProbe=[...document.querySelectorAll('.chip:not(.is-clear)')]
    .find(el=>el.offsetParent && el.getBoundingClientRect().width > 0);
  let boxDrift='측정 대상 없음', boxOk=true;
  if(chipProbe){
    const was=chipProbe.classList.contains('is-on');
    chipProbe.classList.remove('is-on'); const w0=chipProbe.getBoundingClientRect().width;
    chipProbe.classList.add('is-on');    const w1=chipProbe.getBoundingClientRect().width;
    chipProbe.classList.toggle('is-on', was);
    boxOk=Math.abs(w1-w0)<=0.5; boxDrift=w0.toFixed(2)+'px → '+w1.toFixed(2)+'px';
  } else { boxDrift='🟡 측정 대상 0 — 칩이 있는 화면에서 다시 실행하세요'; }
  ok('G-17 선택해도 칩 상자가 안 커진다', boxOk, boxDrift);

  const dark=document.querySelectorAll('#result .pkg, #result .hero').length;
  ok('화면에 다크 카드 없음', dark===0, dark+'개');
  const blocks=1+document.querySelectorAll('.bento .tile').length+document.querySelectorAll('#result .card').length;
  ok('결과 블록 ≤ 8', blocks<=8, blocks+'개');

  /* 색 — 채널이 섞이지 않았는지 */
  const css=[...document.styleSheets].flatMap(sh=>{try{return [...sh.cssRules].map(r=>r.cssText)}catch(e){return []}}).join('');
  const hex=new Set((css.match(/#[0-9a-fA-F]{3,8}\b/g)||[]).map(x=>x.toLowerCase()));
  const rgba=new Set(css.match(/rgba?\([^)]*\)/g)||[]);
  ok('G-6 색 값 ≤ 26', hex.size+rgba.size<=26, hex.size+rgba.size+'개');
  /* 퇴출 대상은 「원색」만입니다. 네이비·베이지 계열은 이제 우리 팔레트입니다. */
  const BANNED=['#2563eb','#3182f6','#0071e3','#0091ff','#1e3a8a',
    '#f59e0b','#ffc342','#dc2626','#f04452','#ff0000','#059669','#15c47e','#248a3d'];
  const revived=BANNED.filter(b=>hex.has(b));
  ok('퇴출 색 미사용', revived.length===0, revived.join(', ')||'없음');

  /* 🔴 G-13 — 전역 선언이 실제로 「닿았는가」 (v23.18)
     letter-spacing은 상속 속성이지만 button·input은 UA 스타일시트가 normal로 덮습니다.
     body에 -.02em을 걸어 두고도 칩·세그먼트·입력창만 0으로 렌더되던 자리입니다.
     소스를 읽어서는 안 보입니다 — 렌더된 값을 재야 걸립니다. */
  const probe=document.createElement('div');
  probe.setAttribute('aria-hidden','true');
  probe.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden';
  probe.innerHTML='<span></span><button type="button"></button><input>';
  document.body.appendChild(probe);
  const lsOf=el=>getComputedStyle(el).letterSpacing;
  const lsP=lsOf(probe.children[0]), lsB=lsOf(probe.children[1]), lsI=lsOf(probe.children[2]);
  probe.remove();
  ok('G-13 자간이 button·input까지 닿음', lsP===lsB && lsP===lsI,
     '본문 '+lsP+' / 버튼 '+lsB+' / 입력 '+lsI);

  /* 🔴 G-14 — 선택해도 테두리가 굵어지지 않는가 (v23.19 재정의)
     v23.18에서는 「안쪽 테두리 0」이 기준이었지만, 하드 보더가 기본이 된 지금은
     모든 칩에 1px 검정 테두리가 있습니다. 지켜야 할 것은 **선택 시 두께가 변하지 않는 것**입니다.
     굵어지면 상자가 커져 flex 줄이 흔들립니다(원칙 34).
     ⚠ 결과 화면에는 .is-on이 없어 0개로 통과합니다. 입력 03에서 한 번 돌리세요. */
  const onEls=[...document.querySelectorAll('.chip.is-on, .zonecard.is-on, .seg button.is-on')];
  const thick=onEls.filter(el=>(parseFloat(getComputedStyle(el).borderTopWidth)||0)>1.5);
  ok('G-14 선택해도 테두리가 굵어지지 않음', thick.length===0,
     onEls.length ? thick.length+' / '+onEls.length+'개' : '선택된 요소 없음 (입력 03에서 확인)');

  if($('result').hidden){ R.push({검사:'나머지', 결과:'—', 값:'결과 화면에서 다시 실행하세요'}); console.table(R); return R; }

  /* G-1 · G-3 — 첫 뷰포트 */
  const hero=document.querySelector('.rhead'), ht=hero.textContent;
  ok('G-1 첫 뷰포트 금액 ≤ 6', (ht.match(moneyRe)||[]).length<=6, (ht.match(moneyRe)||[]).join(' '));
  /* v23.5: LTV·DSR은 한글 설명을 붙이면 허용합니다. 단독은 여전히 금지(원칙 0). */
  const BAN=['자기자본','방공제','중개보수','취득세','조달','소계','거치','원리금균등'];
  const hit=BAN.filter(b=>ht.includes(b));
  if(ht.includes('LTV') && !ht.includes('비율(LTV)')) hit.push('LTV(단독)');
  if(ht.includes('DSR') && !ht.includes('규제(DSR)')) hit.push('DSR(단독)');
  ok('G-3 첫 화면 금지어 0', hit.length===0, hit.join(',')||'없음');

  /* G-7 — 같은 금액 반복 */
  const all=$('result').textContent.match(moneyRe)||[], cnt={};
  all.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const worst=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]||['',0];
  ok('G-7 같은 금액 ≤ 2회', worst[1]<=2, worst[0]+' '+worst[1]+'회');

  /* 넘침 — 화면 밖으로 삐져나온 요소 */
  const W=document.documentElement.clientWidth;
  const over=[...document.querySelectorAll('.app *')].filter(el=>{
    const r=el.getBoundingClientRect();
    return r.width>0 && (r.right>W+1 || r.left<-1);
  }).slice(0,5).map(el=>el.id||el.className||el.tagName);
  ok('넘침 요소 0', over.length===0, over.join(', ')||'없음');
  ok('가로 스크롤 없음', document.documentElement.scrollWidth<=W+1,
     document.documentElement.scrollWidth+' / '+W);

  /* 단위 정합 — 만원↔원을 헷갈리면 여기서 걸립니다 */
  if(LASTVIEW){
    const {c, price}=LASTVIEW;
    ok('영수증 합계 일치',
       Math.abs((price+c.tax+c.brokerFee+c.interiorCost+c.etcCost) - (c.mortgageLoan+c.cashNeeded))<10,
       '차이 '+Math.round((price+c.tax+c.brokerFee+c.interiorCost+c.etcCost)-(c.mortgageLoan+c.cashNeeded))+'원');
    ok('집값이 상식 범위(1천만~200억)', price>=1e7 && price<=2e10, formatWon(price));
    ok('대출 ≤ 집값', c.mortgageLoan<=price, formatWon(c.mortgageLoan));
  }
  console.table(R);
  return R;
};

$('ctaBtn').onclick=next;
$('homeBtn').onclick=goHome;
$('prevBtn').onclick=back;
render();
</script>
</body>
</html>
