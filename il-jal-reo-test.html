<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 오피스 빌런인가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F0FF;
    --ink: #111111;
    --pink: #FF3D8B;
    --blue: #2E9BFF;
    --lime: #C6FF3D;
    --orange: #FF8A3D;
    --purple: #7B2FF7;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,61,139,0.25) 0, transparent 42%),
      radial-gradient(circle at 92% 85%, rgba(46,155,255,0.25) 0, transparent 42%),
      var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:44px 16px;
  }
  .display{ font-family:'Black Han Sans', sans-serif; letter-spacing:.01em; }
  .sheet{
    width:100%;
    max-width:600px;
    background:var(--card);
    border:3px solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
    position:relative;
    padding:38px 32px 34px;
    min-height:520px;
  }
  .sticker{
    position:absolute;
    top:-20px;
    right:26px;
    background:var(--lime);
    color:var(--ink);
    border:3px solid var(--ink);
    padding:6px 14px;
    font-size:13px;
    font-weight:900;
    transform:rotate(6deg);
    box-shadow:4px 4px 0 var(--ink);
  }
  .eyebrow{
    display:inline-block;
    background:var(--purple);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border:2px solid var(--ink);
    margin-bottom:16px;
    transform:rotate(-2deg);
  }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* START */
  #screen-start h1{
    font-size:32px;
    line-height:1.3;
    margin:0 0 14px;
  }
  #screen-start .desc{
    font-size:15px;
    line-height:1.7;
    font-weight:500;
    color:#2b2b2b;
    margin-bottom:22px;
  }
  .meta-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .meta-chip{
    font-size:12px;
    font-weight:700;
    background:#FFF3B0;
    border:2px solid var(--ink);
    padding:6px 12px;
  }
  button.primary{
    font-family:'Black Han Sans', sans-serif;
    font-size:18px;
    background:var(--pink);
    color:#fff;
    border:3px solid var(--ink);
    padding:14px 26px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.primary:hover{ transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink); }
  button.primary:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }

  /* QUIZ */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
  }
  .progress-label{ font-size:13px; font-weight:700; white-space:nowrap; }
  .progress-track{
    flex:1;
    height:14px;
    background:#fff;
    border:2px solid var(--ink);
    display:flex;
    gap:3px;
    padding:2px;
  }
  .progress-seg{
    flex:1;
    background:transparent;
  }
  .progress-seg.filled{ background:var(--blue); }

  #q-text{
    font-size:20px;
    font-weight:900;
    line-height:1.5;
    margin:0 0 22px;
  }
  .choice{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:15px 16px;
    border:3px solid var(--ink);
    background:#fff;
    margin-bottom:12px;
    cursor:pointer;
    font-size:14.5px;
    font-weight:500;
    line-height:1.5;
    box-shadow:4px 4px 0 var(--ink);
    transition:background .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .choice:hover{ background:#FFF3B0; transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .choice:active{ transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink); }
  .choice .marker{
    font-family:'Black Han Sans', sans-serif;
    color:var(--purple);
    flex-shrink:0;
  }

  /* RESULT */
  #screen-result{ text-align:center; }
  .badge-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    margin:4px 0 20px;
    height:180px;
  }
  .burst{
    position:absolute;
    width:190px;
    height:190px;
    clip-path: polygon(50% 0%, 61% 18%, 82% 8%, 82% 30%, 100% 35%, 88% 50%,
      100% 65%, 82% 70%, 82% 92%, 61% 82%, 50% 100%, 39% 82%, 18% 92%,
      18% 70%, 0% 65%, 12% 50%, 0% 35%, 18% 30%, 18% 8%, 39% 18%);
    background:var(--type-color, var(--pink));
    border:3px solid var(--ink);
    transform:scale(0.3) rotate(-15deg);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,1.6,.4,1), opacity .3s ease;
  }
  .burst.show{ transform:scale(1) rotate(0deg); opacity:1; }
  .badge-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    opacity:0;
    transition:opacity .25s ease .25s;
  }
  .badge-content.show{ opacity:1; }
  .badge-content .emoji{ font-size:54px; }

  #r-type{
    font-family:'Black Han Sans', sans-serif;
    font-size:30px;
    margin:4px 0 6px;
  }
  #r-tag{
    font-size:14.5px;
    font-weight:700;
    color:var(--purple);
    margin-bottom:18px;
  }
  #r-desc{
    text-align:left;
    font-size:14.5px;
    line-height:1.75;
    font-weight:500;
    color:#2b2b2b;
    background:#FBF9F2;
    border:3px solid var(--ink);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .hashtags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:26px;
  }
  .hashtags span{
    font-size:12px;
    font-weight:700;
    background:#fff;
    border:2px solid var(--ink);
    padding:4px 10px;
  }
  button.secondary{
    font-family:'Black Han Sans', sans-serif;
    font-size:14px;
    background:#fff;
    color:var(--ink);
    border:3px solid var(--ink);
    padding:12px 20px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.secondary:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  button.secondary:active{ transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink); }

  @media (max-width:480px){
    .sheet{ padding:30px 18px 26px; }
    #screen-start h1{ font-size:25px; }
    #q-text{ font-size:17px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="sticker display">MZ 인증</div>

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="eyebrow">CLAUDE CODE 동호회 · 자체 제작</div>
    <h1 class="display">나는 어떤 오피스 빌런인가</h1>
    <p class="desc">티 안 나게 숨겨왔던 업무 스타일, 사실 다 티남. 회의실에서 드러나는 찐텐(진짜 텐션) 5문항으로 대공개.</p>
    <div class="meta-row">
      <span class="meta-chip">문항 5개</span>
      <span class="meta-chip">소요시간 1분</span>
      <span class="meta-chip">정직도 100%</span>
    </div>
    <button class="primary" onclick="startQuiz()">내 빌런 정체 까기 →</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="progress-row">
      <span class="progress-label" id="q-count">01 / 05</span>
      <div class="progress-track" id="progress-track"></div>
    </div>
    <p id="q-text"></p>
    <div id="choices"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="badge-wrap">
      <div class="burst" id="burst"></div>
      <div class="badge-content" id="badge-content">
        <div class="emoji" id="r-emoji"></div>
      </div>
    </div>
    <div id="r-type" class="display"></div>
    <div id="r-tag"></div>
    <div id="r-desc"></div>
    <div class="hashtags" id="r-hashtags"></div>
    <button class="secondary" onclick="restart()">다시 진단하기</button>
  </div>
</div>

<script>
const questions = [
  {
    text: "1. 새 프로젝트 던져졌다. 내 뇌 회로가 제일 먼저 켜지는 지점은?",
    choices: [
      { m:"ㄱ", t:"일정표부터 켬. 그림 없이는 한 발짝도 못 뗌", type:"strategist" },
      { m:"ㄴ", t:"일단 뭐라도 만들어봄. 완벽주의는 사치임", type:"sprinter" },
      { m:"ㄷ", t:"단톡방 파서 의견부터 수집. 혼자 하면 불안함", type:"connector" },
      { m:"ㄹ", t:"터질 곳부터 스캔. 사고는 예방이 국룰", type:"fixer" }
    ]
  },
  {
    text: "2. 회의에서 의견 갈릴 때 내 상태는?",
    choices: [
      { m:"ㄱ", t:"\"그거 방향성 맞아요?\" 부터 던짐", type:"strategist" },
      { m:"ㄴ", t:"\"일단 해보고 얘기해요\" 시전", type:"sprinter" },
      { m:"ㄷ", t:"양쪽 다 토닥이며 중재안 마련", type:"connector" },
      { m:"ㄹ", t:"\"근거 있어요?\" 팩폭 들어감", type:"fixer" }
    ]
  },
  {
    text: "3. 마감 코앞. 내 몸이 먼저 반응하는 방식은?",
    choices: [
      { m:"ㄱ", t:"우선순위 다시 짜는 것부터. 안 그러면 다 망함", type:"strategist" },
      { m:"ㄴ", t:"일단 손부터 움직임. 생각은 나중", type:"sprinter" },
      { m:"ㄷ", t:"\"저 좀 도와주실 분?\" SOS 시전", type:"connector" },
      { m:"ㄹ", t:"리스크 지도부터 그림. 뭐가 제일 위험한지 체크", type:"fixer" }
    ]
  },
  {
    text: "4. 팀에 사고 터짐. 나의 포지션은?",
    choices: [
      { m:"ㄱ", t:"재발 방지 시스템부터 설계함", type:"strategist" },
      { m:"ㄴ", t:"일단 불부터 끔. 원인 분석은 그다음", type:"sprinter" },
      { m:"ㄷ", t:"팀 멘탈 케어 담당. 분위기부터 수습", type:"connector" },
      { m:"ㄹ", t:"원인 파고들어서 뿌리 뽑음", type:"fixer" }
    ]
  },
  {
    text: "5. 동료들의 뒷담화(?) 버전, 나에 대한 평가는?",
    choices: [
      { m:"ㄱ", t:"\"그 사람 큰그림 하나는 진짜 잘 그려\"", type:"strategist" },
      { m:"ㄴ", t:"\"일단 걔한테 맡기면 뭐라도 나옴\"", type:"sprinter" },
      { m:"ㄷ", t:"\"그 사람 있으면 회의실 분위기 안 얼어붙음\"", type:"connector" },
      { m:"ㄹ", t:"\"사고 나면 제일 먼저 걔 찾음\"", type:"fixer" }
    ]
  }
];

const results = {
  strategist: {
    color:"var(--blue)", emoji:"🧭", name:"판짜는 자",
    tag:"로드맵 없인 숨도 안 쉬는 인간",
    desc:"일 터지기 전에 이미 지도부터 그리는 스타일. 남들이 \"일단 해보죠\" 할 때 혼자 \"그래서 최종 목표가 뭔데요\"라고 찬물 끼얹는 존재감. 방향 안 맞으면 손도 안 댐. 근데 그 그림 그리는 동안 팀원들 속은 타들어감. 초안이라도 빨리 던지는 연습, 필수임.",
    tags:["#로드맵귀신","#방향성집착","#TMI주의"]
  },
  fixer: {
    color:"var(--pink)", emoji:"🔧", name:"불끄는 자",
    tag:"사이렌 소리가 자장가인 인간",
    desc:"사고 터지면 젤 먼저 뛰어드는 스타일. 원인 파악 없인 못 넘어가는 성격이라 \"일단 덮자\"는 말에 알레르기 반응 일어남. 데이터 없인 아무 말도 안 믿음. 근데 원인 분석하다가 골든타임 놓치는 거 실화임. 일단 임시 조치부터, 분석은 그다음.",
    tags:["#팩폭전문","#사후분석러","#일단막고보자"]
  },
  connector: {
    color:"var(--lime)", emoji:"🤝", name:"분위기 담당",
    tag:"회의실의 인간 가습기",
    desc:"누가 열받았는지, 누가 삐졌는지 레이더에 바로 뜸. 의견 갈리면 양쪽 다 토닥이면서 중재안 짜내는 능력자. 근데 다 만족시키려다 정작 중요한 결정은 계속 미뤄짐. 가끔은 \"싫은 건 싫다\"고 선 긋는 연습, 필요함.",
    tags:["#인간가습기","#중재의신","#결정장애주의"]
  },
  sprinter: {
    color:"var(--orange)", emoji:"🚀", name:"일단 GO",
    tag:"생각보다 손이 빠른 인간",
    desc:"완벽한 계획 없이도 일단 지르고 보는 스타일. \"그래서 계획이 뭔데\"라는 질문에 \"만들면서 생각하죠\"라고 답하는 타입. 속도 하나는 팀 내 넘버원. 근데 가끔 뒤돌아보면 산으로 가있는 프로젝트 발견함. 스퍼트 걸기 전에 지도 한 번씩 확인하는 습관, 강추.",
    tags:["#선실행후보고","#속도가곧실력","#가끔산으로감"]
  }
};

let current = 0;
const scores = { strategist:0, fixer:0, connector:0, sprinter:0 };

function buildProgress(){
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  for(let i=0;i<questions.length;i++){
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.id = 'seg-'+i;
    track.appendChild(seg);
  }
}

function startQuiz(){
  show('screen-quiz');
  current = 0;
  Object.keys(scores).forEach(k => scores[k]=0);
  buildProgress();
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-count').textContent =
    `${String(current+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}`;

  for(let i=0;i<questions.length;i++){
    document.getElementById('seg-'+i).classList.toggle('filled', i <= current);
  }

  const box = document.getElementById('choices');
  box.innerHTML = '';
  q.choices.forEach(c => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.innerHTML = `<span class="marker display">${c.m}</span><span>${c.t}</span>`;
    el.onclick = () => answer(c.type);
    box.appendChild(el);
  });
}

function answer(type){
  scores[type]++;
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  let best = 'strategist', max = -1;
  Object.keys(scores).forEach(k => { if(scores[k] > max){ max = scores[k]; best = k; } });
  const r = results[best];

  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-type').textContent = r.name;
  document.getElementById('r-tag').textContent = `"${r.tag}"`;
  document.getElementById('r-desc').textContent = r.desc;

  const hashBox = document.getElementById('r-hashtags');
  hashBox.innerHTML = '';
  r.tags.forEach(t => {
    const span = document.createElement('span');
    span.textContent = t;
    hashBox.appendChild(span);
  });

  const burst = document.getElementById('burst');
  const content = document.getElementById('badge-content');
  burst.style.setProperty('--type-color', r.color);
  burst.classList.remove('show');
  content.classList.remove('show');

  show('screen-result');
  void burst.offsetWidth;
  setTimeout(()=>{
    burst.classList.add('show');
    content.classList.add('show');
  }, 80);
}

function restart(){
  show('screen-start');
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
